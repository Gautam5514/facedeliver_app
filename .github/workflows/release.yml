name: Release to Play Store

# Builds a signed Android App Bundle and uploads it to the Play Console.
#
# Triggers on a version tag (e.g. v1.0.1) so you control exactly which commit
# ships — a push to main alone will NOT release. You can also run it by hand
# from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/keystore/facedeliver-upload-key.jks
#   KEYSTORE_PASSWORD         the store password
#   KEY_PASSWORD              the key password
#   KEY_ALIAS                 the key alias (facedeliver-upload)
#   PLAY_SERVICE_ACCOUNT_JSON the full JSON of the Play service account key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build AAB and upload to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=config/prod.json

      - name: Upload artifact to workflow (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Write Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-service-account.json
          packageName: in.facedeliver.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Closed testing lives on the 'internal' or 'alpha'/'beta' tracks.
          # workflow_dispatch lets you pick; a tag push defaults to internal.
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Clean up secrets from runner
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties play-service-account.json
